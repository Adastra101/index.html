<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clen-Links Invoice Generator</title>
<style>
:root{--bg:#f1f4fa;--panel:#fff;--ink:#14213d;--mut:#5b6784;--line:#d5dcec;--navy:#0b2a8f;--field:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1424;--panel:#161d33;--ink:#e8ecf7;--mut:#9aa6c4;--line:#2a3452;--field:#0e1424}}
:root[data-theme="dark"]{--bg:#0e1424;--panel:#161d33;--ink:#e8ecf7;--mut:#9aa6c4;--line:#2a3452;--field:#0e1424}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI",system-ui,-apple-system,Arial,sans-serif}
.app{display:grid;grid-template-columns:360px 1fr;gap:20px;padding:20px;max-width:1300px;margin:0 auto}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;align-self:start;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
.panel h2{font-size:15px;margin:16px 0 8px;color:var(--navy)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .panel h2{color:#8fb0ff}}
.panel h2:first-child{margin-top:0}
label{display:block;font-size:12.5px;color:var(--mut);margin:8px 0 3px}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:6px;padding:7px 9px}
input:focus,textarea:focus,button:focus-visible{outline:2px solid #3b6cff;outline-offset:1px}
.row{display:flex;gap:8px}.row>*{flex:1}
.item{border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px}
.item .row{align-items:end}
button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--navy);background:var(--navy);color:#fff;padding:8px 12px}
button.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.stage{overflow:hidden}
#fit{transform-origin:top left}

/* ---------- invoice sheet ---------- */
.sheet{width:794px;min-height:1050px;background:#eef3fc;position:relative;overflow:hidden;color:#1b2340;font-family:"Segoe UI",system-ui,Arial,sans-serif;padding:34px 36px 0;display:flex;flex-direction:column;box-shadow:0 2px 14px rgba(0,0,0,.18)}
.sheet .hd{display:flex;justify-content:space-between;align-items:flex-start}
.brand{display:flex;flex-direction:column;align-items:flex-start}
.brand .top{display:flex;align-items:center;gap:6px}
.brand .name{font-size:40px;font-weight:800;letter-spacing:2px;color:#0b2a8f;line-height:1;margin-top:-2px}
.brand .sub{letter-spacing:7px;font-size:17px;color:#6b7280;margin:4px 0 0 2px}
.brand .tag{font:italic 17px "Brush Script MT","Segoe Script",cursive;color:#0b2a8f;margin:5px 0 0 34px}
.brand img{max-height:112px;max-width:290px;width:auto;height:auto;object-fit:contain;display:block;mix-blend-mode:multiply}
.ttl{text-align:right}
.ttl h1{margin:6px 0 10px;font-size:54px;font-weight:900;color:#0b2a8f;letter-spacing:1px;line-height:1}
.ttl .no{display:inline-block;background:#0b2a8f;color:#fff;font-weight:700;letter-spacing:1px;padding:7px 22px;border-radius:7px;font-size:17px}
.rule{height:2px;background:#0b2a8f;margin:20px 0 18px;opacity:.85}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:0}
.meta>div{display:flex;gap:12px;align-items:flex-start;padding:4px 0}
.meta>div+div{border-left:2px solid #0b2a8f;padding-left:22px}
.meta svg{flex:none}
.meta b.k{color:#0b2a8f;font-size:17px;letter-spacing:.5px;display:block}
.meta .v{font-size:15px;margin-top:6px;white-space:pre-line}
.meta .billed .v{font-weight:700;font-size:16px}
table{width:100%;border-collapse:separate;border-spacing:0;margin-top:20px;background:linear-gradient(135deg,#f2f7ff 0%,#e8f1ff 55%,#f6f9ff 100%);border:1px solid #c5d3ee;border-radius:12px;overflow:hidden;table-layout:fixed}
th{background:linear-gradient(110deg,#0b2a8f 0%,#1e5bc6 55%,#1e90ff 100%);color:#fff;font-weight:600;font-size:14.5px;padding:11px 8px;letter-spacing:.5px}
td{padding:4px 8px;font-size:14px;line-height:1.3;border-right:1px solid #c5d3ee;vertical-align:middle;white-space:pre-line;background:rgba(255,255,255,.18)}
td:last-child,th:last-child{border-right:0}
th:nth-child(1),td:nth-child(1){width:34%}th:nth-child(3),td:nth-child(3){width:26%}
td:nth-child(1){text-align:center;font-weight:700}td:nth-child(2){text-align:center}td:nth-child(3){text-align:center;font-weight:800;font-size:16px}
tr.fill td{height:var(--fillh,200px);padding:0;background:transparent}
tr.tot td{background:linear-gradient(110deg,#e4edff 0%,#dceaff 100%);border-top:1px solid #c5d3ee;padding:0;border-right:0;vertical-align:middle}
.totl{text-align:right!important;color:#0b2a8f;font-weight:800;font-size:17px;padding:14px 18px!important}
.totv{background:#0b2a8f!important;color:#fff;font-weight:800;font-size:17px;text-align:center!important;padding:14px 8px!important}
.notes{margin-top:14px;font-size:13px;color:#4a5578;white-space:pre-line}
.bottom{margin-top:auto;position:relative}
.acct{position:relative;top:-10px;z-index:1;width:250px;border:1px solid #c5d3ee;border-radius:8px;overflow:hidden;background:#f6f9ff;margin-top:18px}
.acct .h{background:#0b2a8f;color:#fff;font-weight:700;font-size:13.5px;padding:10px 12px;display:flex;gap:10px;align-items:center;letter-spacing:.5px}
.acct .r{display:flex;gap:10px;align-items:center;padding:9px 12px;border-top:1px solid #c5d3ee}
.acct .r small{display:block;font-size:10.5px;color:#374265;letter-spacing:.4px}
.acct .r b{font-size:14.5px;display:block}
.art{position:absolute;right:0;bottom:0;width:430px;z-index:0;pointer-events:none}
.foot{z-index:1;background:#0b2a8f;color:#fff;margin:0 -36px;padding:14px 36px 14px;margin-top:-10px;position:relative;clip-path:polygon(0 0,52% 0,56% 100%,0 100%);width:calc(100% + 72px);min-height:78px;display:flex;flex-direction:column;gap:8px;justify-content:center;font-size:14.5px}
.foot div{display:flex;gap:12px;align-items:center}


@media (max-width:900px){.app{grid-template-columns:1fr}.panel{position:static;max-height:none}}
@media print{
 @page{size:A4;margin:0}
 body{background:#fff}.app{display:block;padding:0;max-width:none}.panel{display:none}
 .stage{overflow:visible}#fit{transform:none!important;height:auto!important}
 .sheet{box-shadow:none;width:210mm;min-height:297mm;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="app">
<aside class="panel">
 <h2>Invoice</h2>
 <label>Invoice number</label>
 <div class="row"><input id="no"><button class="ghost" id="gen" style="flex:none">New</button></div>
 <label>Invoice date</label><input id="date" type="date">
 <label>Billed to</label><textarea id="to" rows="2"></textarea>

 <h2>Line items</h2>
 <div id="items"></div>
 <button class="ghost" id="add">Add line item</button>
 <label>Notes (optional)</label><textarea id="notes" rows="2" placeholder="Payment terms, reference, thank-you line"></textarea>

 <h2>Account details</h2>
 <label>Account number</label><input id="an">
 <label>Bank name</label><input id="bn">
 <label>Account name</label><input id="am">

 <h2>Company</h2>
 <label>Company name</label><input id="cn">
 <label>Second line</label><input id="cs">
 <label>Tagline</label><input id="ct">
 <label>Phone</label><input id="ph">
 <label>Email</label><input id="em">
 <label>Logo image (replace the Clen-Links logo)</label><input id="logo" type="file" accept="image/*">

 <div class="actions"><button id="print">Print or save as PDF</button><button class="ghost" id="reset">Reset</button></div>
</aside>

<main class="stage" id="stage"><div id="fit">
<section class="sheet" id="sheet">
 <div class="hd">
  <div class="brand" id="brand"></div>
  <div class="ttl"><h1>INVOICE</h1><span class="no" id="p-no"></span></div>
 </div>
 <div class="rule"></div>
 <div class="meta">
  <div class="billed">
   <svg width="40" height="40" viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="#fff" stroke="#0b2a8f" stroke-width="2.5"/><circle cx="20" cy="15" r="6" fill="#0b2a8f"/><path d="M8 32c2-7 8-9 12-9s10 2 12 9" fill="#0b2a8f"/></svg>
   <div><b class="k">BILLED TO:</b><div class="v" id="p-to"></div></div>
  </div>
  <div>
   <svg width="40" height="40" viewBox="0 0 40 40"><rect x="5" y="8" width="30" height="27" rx="4" fill="#fff" stroke="#0b2a8f" stroke-width="2.5"/><rect x="5" y="8" width="30" height="8" rx="3" fill="#0b2a8f"/><path d="M12 3v7M28 3v7" stroke="#0b2a8f" stroke-width="3" stroke-linecap="round"/><g fill="#0b2a8f"><rect x="10" y="20" width="4" height="3"/><rect x="18" y="20" width="4" height="3"/><rect x="26" y="20" width="4" height="3"/><rect x="10" y="27" width="4" height="3"/><rect x="18" y="27" width="4" height="3"/><rect x="26" y="27" width="4" height="3"/></g></svg>
   <div><b class="k">INVOICE DATE:</b><div class="v" id="p-date"></div></div>
  </div>
 </div>
 <table>
  <thead><tr><th>DESCRIPTION</th><th>DETAILS</th><th>AMOUNT (NGN)</th></tr></thead>
  <tbody id="p-rows"></tbody>
  <tfoot><tr class="tot"><td class="totl" colspan="2">TOTAL</td><td class="totv" id="p-tot"></td></tr></tfoot>
 </table>
 <div class="notes" id="p-notes"></div>
 <div class="bottom">
  <div class="acct">
   <div class="h"><svg width="20" height="20" viewBox="0 0 24 24" fill="#fff"><path d="M12 2 2 8v2h20V8zM4 11v7h3v-7zm6.5 0v7h3v-7zM17 11v7h3v-7zM2 20v2h20v-2z"/></svg>ACCOUNT DETAILS</div>
   <div class="r"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0b2a8f" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h5"/></svg><div><small>ACCOUNT NUMBER:</small><b id="p-an"></b></div></div>
   <div class="r"><svg width="26" height="26" viewBox="0 0 24 24" fill="#0b2a8f"><path d="M12 2 2 8v2h20V8zM4 11v7h3v-7zm6.5 0v7h3v-7zM17 11v7h3v-7zM2 20v2h20v-2z"/></svg><div><small>BANK NAME:</small><b id="p-bn"></b></div></div>
   <div class="r"><svg width="26" height="26" viewBox="0 0 24 24" fill="#0b2a8f"><circle cx="12" cy="7" r="5"/><path d="M3 22c0-5 4-8 9-8s9 3 9 8z"/></svg><div><small>ACCOUNT NAME:</small><b id="p-am"></b></div></div>
  </div>
  <div class="foot">
   <div><svg width="22" height="22" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#fff"/><path d="M8 6h2l1 3-1.5 1a8 8 0 0 0 4.500 4.500L15 13l3 1v2a2 2 0 0 1-2 2A10 10 0 0 1 6 8a2 2 0 0 1 2-2z" fill="#0b2a8f"/></svg><span id="p-ph"></span></div>
   <div><svg width="22" height="22" viewBox="0 0 24 24"><rect x="1" y="3" width="22" height="18" rx="4" fill="#fff"/><path d="M4 8l8 6 8-6" fill="none" stroke="#0b2a8f" stroke-width="2"/></svg><span id="p-em"></span></div>
  </div>
 </div>

let S;
try{S=JSON.parse(localStorage.getItem("clgs-inv")||"null")}catch(e){S=null}
S=Object.assign({},DEF,S||{});if(!S.logo)S.logo=DEF.logo;
const save=()=>{try{localStorage.setItem("clgs-inv",JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>(Number(n)||0).toLocaleString("en-NG");
const fdate=v=>{if(!v)return"";const[y,m,d]=v.split("-");return `${d}/${m}/${y}`};

const markSvg=`<svg width="62" height="62" viewBox="0 0 62 62"><rect x="30" y="2" width="14" height="14" rx="3" transform="rotate(45 37 9)" fill="#1e90ff"/><rect x="4" y="14" width="30" height="30" rx="8" transform="rotate(45 19 29)" fill="none" stroke="#0b2a8f" stroke-width="5"/><rect x="26" y="24" width="30" height="30" rx="8" transform="rotate(45 41 39)" fill="none" stroke="#0b2a8f" stroke-width="5"/><circle cx="25" cy="34" r="5" fill="#1e90ff"/></svg>`;

function bind(id,key){const el=$(id);el.value=S[key];el.addEventListener("input",()=>{S[key]=el.value;save();render()})}
[["no","no"],["date","date"],["to","to"],["notes","notes"],["an","an"],["bn","bn"],["am","am"],["cn","cn"],["cs","cs"],["ct","ct"],["ph","ph"],["em","em"]].forEach(([i,k])=>bind(i,k));

function drawItems(){
 $("items").innerHTML=S.items.map((it,i)=>`<div class="item">
  <label>Description</label><input data-i="${i}" data-f="d" value="${esc(it.d)}">
  <label>Details</label><input data-i="${i}" data-f="t" value="${esc(it.t)}">
  <div class="row"><div><label>Amount (NGN)</label><input data-i="${i}" data-f="a" type="number" min="0" step="any" value="${it.a}"></div>
  <button class="ghost" data-del="${i}" style="flex:none" aria-label="Remove line item ${i+1}">Remove</button></div></div>`).join("");
}
$("items").addEventListener("input",e=>{const t=e.target;if(t.dataset.i==null)return;S.items[t.dataset.i][t.dataset.f]=t.dataset.f==="a"?parseFloat(t.value)||0:t.value;save();render()});
$("items").addEventListener("click",e=>{const d=e.target.dataset.del;if(d==null)return;S.items.splice(d,1);save();drawItems();render()});
$("add").onclick=()=>{S.items.push({d:"",t:"",a:0});save();drawItems();render()};
$("gen").onclick=()=>{const d=new Date(),p=n=>String(n).padStart(2,"0");
 S.no=`INV-CLGS-${d.getFullYear()}-${p(d.getMonth()+1)}${p(d.getDate())}`;$("no").value=S.no;save();render()};
$("logo").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{S.logo=r.result;save();render()};r.readAsDataURL(f)};
$("print").onclick=()=>window.print();
$("reset").onclick=()=>{if(!confirm("Reset everything to the sample invoice?"))return;S=JSON.parse(JSON.stringify(DEF));save();
 [["no","no"],["date","date"],["to","to"],["notes","notes"],["an","an"],["bn","bn"],["am","am"],["cn","cn"],["cs","cs"],["ct","ct"],["ph","ph"],["em","em"]].forEach(([i,k])=>$(i).value=S[k]);drawItems();render()};

function render(){
 $("brand").innerHTML=S.logo?`<img src="${S.logo}" alt="Logo">`:
  `<div class="top">${markSvg}</div><div class="name">${esc(S.cn)}</div><div class="sub">${esc(S.cs.split("").join(" ").replace(/ {3}/g,"  "))}</div><div class="tag">${esc(S.ct)}</div>`;
 $("p-no").textContent=S.no;$("p-to").textContent=S.to;$("p-date").textContent=fdate(S.date);
 const n=S.items.length;
 $("p-rows").innerHTML=S.items.map(it=>`<tr><td>${esc(it.d)}</td><td>${esc(it.t)}</td><td>${fmt(it.a)}</td></tr>`).join("")+
  `<tr class="fill"><td></td><td></td><td></td></tr>`;
 document.getElementById("sheet").style.setProperty("--fillh","14px");
 $("p-tot").textContent=fmt(S.items.reduce((s,i)=>s+(+i.a||0),0));
 $("p-notes").textContent=S.notes;
 $("p-an").textContent=S.an;$("p-bn").textContent=S.bn;$("p-am").textContent=S.am;
 $("p-ph").textContent=S.ph;$("p-em").textContent=S.em;
 document.title=S.no+" - "+S.cn;
 fit();
}
function fit(){
 const st=$("stage"),f=$("fit"),sh=$("sheet");
 if(matchMedia("print").matches){return}
 const sc=Math.min(1,st.clientWidth/794);
 f.style.transform=`scale(${sc})`;
 st.style.height=(sh.offsetHeight*sc)+"px";
}
addEventListener("resize",fit);
drawItems();render();
</script>
</body>
</html>
